<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-gray-800 p-8 rounded-xl shadow-2xl">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-400">Interactive Quiz</h1>
        
        <div id="quiz" class="hidden">
            <div class="flex justify-between mb-6">
                <span id="score" class="text-green-400 font-semibold">Score: 0</span>
                <span id="timer" class="text-red-400 font-semibold">Time: 15s</span>
            </div>
            <div class="bg-gray-700 p-6 rounded-lg mb-6">
                <p id="question" class="text-xl mb-4"></p>
                <span id="qnum" class="text-sm text-blue-300"></span>
            </div>
            <div id="options" class="space-y-3"></div>
            <div id="feedback" class="text-center mt-4 h-6"></div>
        </div>

        <div id="results" class="hidden text-center">
            <h2 class="text-2xl font-bold text-blue-400 mb-4">Quiz Complete!</h2>
            <p class="text-4xl font-bold text-green-400 mb-4" id="final"></p>
            <p id="message" class="text-lg mb-6"></p>
            <button id="restart" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold">Play Again</button>
        </div>

        <div id="start" class="text-center">
            <p class="text-xl mb-6">Ready to test your knowledge?</p>
            <button id="begin" class="bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-lg font-semibold text-lg">Start Quiz</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "What is the capital of India?", a: "New Delhi", o: ["Mumbai", "New Delhi", "Kolkata", "Chennai"] },
            { q: "Which is the longest river in India?", a: "Ganges", o: ["Yamuna", "Ganges", "Godavari", "Narmada"] },
            { q: "Taj Mahal is located in?", a: "Agra", o: ["Delhi", "Agra", "Jaipur", "Lucknow"] },
            { q: "India's national animal?", a: "Tiger", o: ["Lion", "Tiger", "Elephant", "Peacock"] },
            { q: "Independence Day of India?", a: "August 15", o: ["January 26", "August 15", "October 2", "May 1"] },
            { q: "Most popular sport in India?", a: "Cricket", o: ["Football", "Cricket", "Hockey", "Tennis"] },
            { q: "Number of states in India?", a: "28", o: ["26", "28", "30", "29"] },
            { q: "Festival of lights?", a: "Diwali", o: ["Holi", "Diwali", "Eid", "Christmas"] },
            { q: "What does HTML stand for?", a: "HyperText Markup Language", o: ["HyperTool Multi Language", "HyperText Markup Language", "High-Level Text Management", "Home Tool Markup Language"] },
            { q: "Python function to print output?", a: "print()", o: ["console()", "print()", "output()", "display()"] }
        ];

        let current = 0, score = 0, timer = 15, interval, locked = false;
        const shuffle = arr => arr.sort(() => Math.random() - 0.5);

        const $ = id => document.getElementById(id);
        const show = id => $(id).classList.remove('hidden');
        const hide = id => $(id).classList.add('hidden');

        function startQuiz() {
            shuffle(questions);
            current = score = 0;
            hide('start'); hide('results'); show('quiz');
            nextQuestion();
        }

        function nextQuestion() {
            if (current >= questions.length) return endQuiz();
            
            locked = false;
            timer = 15;
            const q = questions[current];
            
            $('question').textContent = q.q;
            $('qnum').textContent = `Question ${current + 1} of ${questions.length}`;
            $('score').textContent = `Score: ${score}`;
            $('feedback').textContent = '';
            
            $('options').innerHTML = '';
            shuffle(q.o).forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.className = 'w-full p-3 bg-gray-600 hover:bg-gray-500 rounded-lg text-left';
                btn.onclick = () => answer(opt);
                $('options').appendChild(btn);
            });
            
            startTimer();
        }

        function startTimer() {
            clearInterval(interval);
            interval = setInterval(() => {
                if (locked) return;
                timer--;
                $('timer').textContent = `Time: ${timer}s`;
                if (timer <= 0) answer(null);
            }, 1000);
        }

        function answer(selected) {
            if (locked) return;
            locked = true;
            clearInterval(interval);
            
            const correct = questions[current].a;
            const isRight = selected === correct;
            
            if (isRight) {
                score++;
                $('feedback').textContent = '✅ Correct!';
                $('feedback').className = 'text-center mt-4 h-6 text-green-400';
            } else {
                $('feedback').textContent = selected ? '❌ Wrong!' : '⏰ Time up!';
                $('feedback').className = 'text-center mt-4 h-6 text-red-400';
            }
            
            [...$('options').children].forEach(btn => {
                btn.onclick = null;
                if (btn.textContent === correct) btn.className = 'w-full p-3 bg-green-600 rounded-lg text-left';
                else if (btn.textContent === selected) btn.className = 'w-full p-3 bg-red-600 rounded-lg text-left';
                else btn.className = 'w-full p-3 bg-gray-700 rounded-lg text-left';
            });
            
            current++;
            setTimeout(nextQuestion, 2000);
        }

        function endQuiz() {
            hide('quiz'); show('results');
            $('final').textContent = `${score}/${questions.length}`;
            
            const messages = [
                "Perfect! Outstanding work! 🌟",
                "Excellent! Well done! 👏",
                "Great job! Keep it up! 💪",
                "Good effort! Try again! 😊",
                "Nice try! Practice more! 📚"
            ];
            
            const msg = score === questions.length ? messages[0] :
                       score >= 8 ? messages[1] :
                       score >= 6 ? messages[2] :
                       score >= 4 ? messages[3] : messages[4];
            
            $('message').textContent = msg;
        }

        $('begin').onclick = startQuiz;
        $('restart').onclick = startQuiz;
    </script>
</body>
</html>
